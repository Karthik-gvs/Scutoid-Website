<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Scutoid</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/Scutoid_Favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body home">

<header class="login-top">
  <a class="logo" href="index.html" aria-label="Back to Scutoid AI Labs"><img src="assets/Scutoid_Logo_Light_2.png" alt="Scutoid" height="28"><span class="logo-tag">AI Labs</span></a>
  <a class="inline" href="index.html">Back to Website</a>
</header>

<main class="login-main">
  <div class="card login-card">
    <h1>Sign in</h1>
    <p class="login-sub">Sign in to access your applications.</p>

    <div class="login-demo"><span class="badge orange dot">Demo</span><span>This is a placeholder page. The real product sign-in will be connected here. No account is checked.</span></div>

    <form id="loginForm" novalidate>
      <label class="fld">Work email
        <input type="email" id="lEmail" autocomplete="off" placeholder="you@company.com" required>
        <span class="err" id="lEmailErr" hidden>Enter a valid email address.</span>
      </label>
      <label class="fld">Password
        <span class="pw">
          <input type="password" id="lPass" autocomplete="off" placeholder="Enter your password" required>
          <button type="button" class="inline" id="lShow" aria-label="Show password">Show</button>
        </span>
        <span class="err" id="lPassErr" hidden>Enter your password.</span>
      </label>
      <div class="login-row"><a class="inline" href="#" id="lForgot">Forgot Password?</a></div>
      <button class="btn t1 lg" type="submit" id="lSubmit">Sign In</button>
      <p class="form-msg" id="lMsg" role="status"></p>
    </form>

    <p class="login-foot">New to Scutoid? <a class="inline" href="index.html#early-access">Book a Demo</a></p>
  </div>
</main>

<script src="login.js"></script>
</body>
</html>
